name: Backend CI

# Бэкенд живёт в подкаталоге монорепозитория, поэтому все шаги выполняются
# из backend/, а запуск ограничен изменениями в нём и в самом workflow.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: hackathon
          POSTGRES_DB: hackathon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackathon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://hackathon:hackathon@localhost:5432/hackathon_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          # --new-from-merge-base сравнивает с origin/main: нужна история.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './docs/*'))
          if [ -n "$unformatted" ]; then
            echo "Не отформатированы:"; echo "$unformatted"; exit 1
          fi

      - name: Сборка
        run: go build ./...

      - name: Статический анализ
        run: go vet ./...

      # Храповик на PR: замечание блокирует сборку, только если внесено самим
      # изменением. Существующий долг не роняет CI, но и не растёт.
      - name: golangci-lint (изменения PR)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: backend
          args: --new-from-merge-base=origin/main --whole-files

      # На push в main merge-base пуст и предыдущий шаг не проверил бы ничего.
      # Второй слой: общее число замечаний против базового уровня из
      # docs/baselines/lint.json. Долг не растёт даже при прямом push.
      - name: Установка golangci-lint
        if: github.event_name != 'pull_request'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.6.0

      - name: golangci-lint против базового уровня
        if: github.event_name != 'pull_request'
        run: bash scripts/check-lint-baseline.sh

      - name: Модульные тесты с покрытием
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Итог покрытия
        run: |
          go tool cover -func=coverage.out | tail -1
          rm -f coverage.out

      - name: Интеграционные тесты
        run: go test -tags=integration -race -count=1 ./...

      - name: Актуальность спецификации OpenAPI
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/controllers/router.go -o docs --parseInternal --outputTypes go,json,yaml
          if ! git diff --quiet -- .; then
            echo "Спецификация OpenAPI устарела: выполните make docs"; git diff --stat -- .; exit 1
          fi

  image:
    name: Публикация образа
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
