name: Backend CI

# The backend lives in a monorepo subdirectory, so all steps run from backend/
# and the trigger is limited to changes in it and in the workflow itself.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timeline
          POSTGRES_PASSWORD: timeline
          POSTGRES_DB: timeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://timeline:timeline@localhost:5432/timeline_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5
        with:
          # --new-from-merge-base compares against origin/main: history is needed.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Formatting check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './docs/*'))
          if [ -n "$unformatted" ]; then
            echo "Not formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Static analysis
        run: go vet ./...

      # A cycle that runs through a test file is legal for the compiler and
      # still knots two packages together, so `go build` cannot be the check.
      - name: Import cycles
        working-directory: .
        run: bash scripts/check-import-cycles.sh

      # Ratchet on a PR: an issue blocks the build only if introduced by the
      # change itself. The existing debt does not break CI, but does not grow.
      - name: golangci-lint (PR changes)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: backend
          args: --new-from-merge-base=origin/main --whole-files

      # On a push to main the merge-base is empty and the previous step would
      # check nothing. Second layer: the total number of issues against the
      # baseline from docs/baselines/lint.json. The debt does not grow even on a
      # direct push.
      - name: Install golangci-lint
        if: github.event_name != 'pull_request'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.6.0

      # The script lives at the repository root and walks down to backend/
      # itself, so it must not inherit the backend working directory.
      - name: golangci-lint against the baseline
        if: github.event_name != 'pull_request'
        working-directory: .
        run: bash scripts/check-lint-baseline.sh

      - name: Unit tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # The suites that carry the backend - authorization, section 16
      # transitions and AC-NOTIF-01..19 - sit behind the `integration` tag, so
      # they need their own profile. Reporting only the untagged number once
      # made coverage look like 0.7% when it was in fact far higher.
      - name: Integration tests with coverage
        run: >-
          go test -tags=integration -race -count=1
          -coverpkg=./internal/... -coverprofile=coverage-integration.out ./...

      - name: Test and coverage summary
        if: always()
        run: |
          {
            echo "## Backend"
            echo ""
            echo "| Check | Result |"
            echo "|----|----|"
            unit=$(go tool cover -func=coverage.out 2>/dev/null | tail -1 | awk '{print $3}')
            full=$(go tool cover -func=coverage-integration.out 2>/dev/null | tail -1 | awk '{print $3}')
            echo "| Coverage, unit tests alone | ${unit:-n/a} |"
            echo "| Coverage, including integration | ${full:-n/a} |"
            echo "| Packages | $(go list ./... | wc -l) |"
            echo "| golangci-lint | $(grep -oE '"total"[^0-9]*[0-9]+' ../docs/baselines/lint.json | grep -oE '[0-9]+$') issues, baseline |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f coverage.out coverage-integration.out

      - name: OpenAPI specification is up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/controllers/router.go -o docs --parseInternal --outputTypes go,json,yaml
          if ! git diff --quiet -- .; then
            echo "OpenAPI specification is out of date: run make docs"; git diff --stat -- .; exit 1
          fi

  image:
    name: Publish image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io rejects a tag with uppercase letters, and the repository is
      # GoatWhistle/timeline, so the name is lowercased here rather than
      # spelled out by hand.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          # The build context is the monorepo root and the Dockerfile lives in
          # deploy/, exactly as deploy/docker-compose.yml builds it.
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
