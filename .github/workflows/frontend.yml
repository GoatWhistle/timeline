name: Frontend CI

# Frontend checks and repository-wide ratchets. The line-limit check covers both
# parts of the monorepo, so the path filter here is wider than in backend.yml.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/docker-compose.contract.yml'
      - 'Makefile'
      - 'docs/swagger.json'
      - 'docs/baselines/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/docker-compose.contract.yml'
      - 'Makefile'
      - 'docs/swagger.json'
      - 'docs/baselines/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

jobs:
  verify:
    name: Checks and ratchets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 250-line limit for hand-written code
        run: bash scripts/check-file-length.sh

      - name: File-count limit per package
        run: bash scripts/check-package-size.sh

      - name: Code language is English
        run: bash scripts/check-cyrillic.sh

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Contract, types, linter and tests
        working-directory: frontend
        run: npm run verify

      - name: Coverage against thresholds
        working-directory: frontend
        run: npm run test:coverage

      # The contract tests replaced the MSW ones (part IIIa of the refactoring
      # plan): they run against a real API raised by compose, not against mocks.
      - name: Contract tests against a real API
        run: make test-contract

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Sign-in scenario end to end
        run: make e2e

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Bundle size against the baseline
        run: node scripts/bundle-size.mjs

      # Writes coverage and bundle numbers into the run summary, so a failure
      # is readable without opening the log.
      - name: Run summary
        if: always()
        run: node scripts/ci-summary.mjs
