name: Frontend CI

# Frontend checks and repository-wide ratchets. The line-limit check covers both
# parts of the monorepo, so the path filter here is wider than in backend.yml.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/swagger.json'
      - 'docs/baselines/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/swagger.json'
      - 'docs/baselines/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

jobs:
  verify:
    name: Checks and ratchets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 250-line limit for hand-written code
        run: bash scripts/check-file-length.sh

      - name: Code language is English
        run: bash scripts/check-cyrillic.sh

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Contract, types, linter and tests
        working-directory: frontend
        run: npm run verify

      - name: Coverage against thresholds
        working-directory: frontend
        run: npm run test:coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Bundle size against the baseline
        run: node scripts/bundle-size.mjs
