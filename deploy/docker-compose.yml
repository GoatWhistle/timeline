
name: timeline

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD:-timeline}@postgres:5432/${POSTGRES_DB:-timeline}?sslmode=disable
  HTTP_ADDR: ":8080"
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_COLOR: ${LOG_COLOR:-auto}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-5173}}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-5173}}
  NICKNAME_HOLD_TTL: ${NICKNAME_HOLD_TTL:-720h}
  AVATAR_STORAGE_ROOT: /var/lib/timeline/avatars
  COVER_STORAGE_ROOT: /var/lib/timeline/covers
  GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH-/usr/share/timeline/geoip/geoip-city.mmdb}

x-backend: &backend
  image: timeline-backend:${VERSION:-0.8.0}
  pull_policy: never
  env_file:
    - path: ../.env
      required: false
  environment: *backend-env
  volumes:
    - avatars:/var/lib/timeline/avatars
    - covers:/var/lib/timeline/covers
  networks:
    - timeline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeline}
      POSTGRES_DB: ${POSTGRES_DB:-timeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timeline} -d ${POSTGRES_DB:-timeline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - timeline

  migrations:
    <<: *backend
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        VERSION: ${VERSION:-0.8.0}
    command: ["serve"]
    environment:
      <<: *backend-env
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:-timeline_app}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:-timeline_app}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: timeline-frontend:${VERSION:-0.8.0}
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - timeline

volumes:
  pgdata:
  avatars:
  covers:

networks:
  timeline:
    driver: bridge
