# Полный стек Hackathon Tracker в Docker: PostgreSQL, миграции, первый
# администратор, HTTP API, worker доставки и собранный фронтенд за nginx.
#
#   make docker-up                                    # из корня репозитория
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# После запуска: приложение на http://localhost:5173, API на
# http://localhost:8080, Swagger UI на http://localhost:8080/docs/.
# Фронтенд ходит в API через nginx на своём же origin (deploy/nginx.conf),
# прямой порт API открыт только для отладки и Swagger UI.
#
# Прикладная конфигурация читается из backend/.env — того же файла, что и при
# локальном запуске; при его отсутствии действуют значения по умолчанию из
# internal/config (приложение C ТЗ). Блок `environment` перекрывает файл там,
# где адреса внутри сети Docker отличаются от локальных.
#
# Переопределение портов и учётных данных — через окружение или deploy/.env:
#   WEB_PORT=5199 API_PORT=8099 make docker-up

name: hackathon-tracker

# Общая часть трёх сервисов на одном образе backend: serve, worker и
# одноразовые команды migrate/admin.
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
    args:
      VERSION: ${VERSION:-0.8.0}
  image: hackathon-tracker-backend:${VERSION:-0.8.0}
  env_file:
    - path: ../backend/.env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-hackathon}:${POSTGRES_PASSWORD:-hackathon}@postgres:5432/${POSTGRES_DB:-hackathon}?sslmode=disable
    HTTP_ADDR: ":8080"
    # Ссылки в письмах и приглашениях ведут на фронтенд, а не на API.
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-5173}}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-5173}}
    # Читает только команда `admin create`, остальным сервисам безразличны.
    FIRST_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    FIRST_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
    FIRST_ADMIN_NAME: ${ADMIN_NAME:-Администратор}
  networks:
    - hackathon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackathon} -d ${POSTGRES_DB:-hackathon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - hackathon

  # Одноразовая команда: применяет миграции и завершается.
  migrate:
    <<: *backend
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Одноразовая команда: создаёт первого администратора, если его ещё нет.
  # Повторный запуск на существующем адресе ничего не меняет.
  bootstrap:
    <<: *backend
    command: ["admin", "create"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    command: ["serve"]
    ports:
      - "${API_PORT:-8080}:8080"
    # Через bootstrap, а не напрямую через migrate: так `up api` тянет за собой
    # и создание администратора, и API поднимается на готовой к входу базе.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: hackathon-tracker-frontend:${VERSION:-0.8.0}
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: nginx слушает только IPv4, а busybox wget
      # сначала пробует ::1 и получает отказ.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hackathon

volumes:
  pgdata:

networks:
  hackathon:
    driver: bridge
