# Режим разработки: тот же стек, но с монтированием исходников.
# Накладывается поверх docker-compose.yml и не используется отдельно:
#
#   make dev
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build
#
# Отличия от боевого режима:
#   * фронтенд — dev-сервер Vite с HMR вместо nginx с готовой сборкой;
#   * backend — `go run` поверх смонтированного кода: перекомпиляция при
#     `make dev-restart`, пересборка образа не нужна;
#   * MOCKS=1 переключает фронтенд на моки MSW вместо обращений к API.
#
# Кэши Go и сборка Vite живут в томах: без них каждый запуск компилировал бы
# зависимости заново.

services:
  migrate:
    build:
      target: dev
    command: ["go", "run", "./cmd/hackathon", "migrate", "up"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  bootstrap:
    build:
      target: dev
    command: ["go", "run", "./cmd/hackathon", "admin", "create"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  api:
    build:
      target: dev
    command: ["go", "run", "./cmd/hackathon", "serve"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    healthcheck:
      # Компиляция при старте занимает заметно больше, чем запуск бинаря.
      start_period: 120s
      interval: 5s
      retries: 30

  worker:
    build:
      target: dev
    command: ["go", "run", "./cmd/hackathon", "worker"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  web:
    build:
      target: dev
      args:
        # Аргумент боевой сборки в dev-стадии не используется, но должен быть
        # объявлен: иначе compose передаст его в образ без такого ARG.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # MOCKS=1 — экраны работают на моках MSW, backend не опрашивается.
      VITE_ENABLE_MSW: ${MOCKS:-0}
      # Без моков dev-сервер проксирует /api на контейнер API.
      VITE_API_PROXY: http://api:8080
    # !override обязателен: списки в compose складываются, и без него к
    # публикации из боевого файла (порт nginx 8080) добавился бы второй
    # маппинг на тот же порт хоста.
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gomod:
  gocache:
