# Development mode: the same stack, but with sources mounted.
# Layered on top of docker-compose.yml and never used on its own:
#
#   make dev
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build
#
# Differences from production mode:
#   * frontend - the Vite dev server with HMR instead of nginx with a built bundle;
#   * backend - `go run` over the mounted code: recompilation on
#     `make dev-restart`, no image rebuild needed;
#   * MOCKS=1 switches the frontend to MSW mocks instead of calling the API.
#
# Go caches and the Vite build live in volumes: without them every run would
# compile dependencies from scratch.

services:
  migrate:
    build:
      target: dev
    command: ["go", "run", "./cmd/timeline", "migrate", "up"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  bootstrap:
    build:
      target: dev
    command: ["go", "run", "./cmd/timeline", "admin", "create"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  api:
    build:
      target: dev
    command: ["go", "run", "./cmd/timeline", "serve"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    healthcheck:
      # Compiling at startup takes noticeably longer than launching a binary.
      start_period: 120s
      interval: 5s
      retries: 30

  worker:
    build:
      target: dev
    command: ["go", "run", "./cmd/timeline", "worker"]
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  web:
    build:
      target: dev
      args:
        # The production build argument is unused in the dev stage but must be
        # declared: otherwise compose passes it to an image without such an ARG.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # MOCKS=1 - screens run on MSW mocks, the backend is not queried.
      VITE_ENABLE_MSW: ${MOCKS:-0}
      # Without mocks the dev server proxies /api to the API container.
      VITE_API_PROXY: http://api:8080
    # !override is required: compose merges lists, and without it a second
    # mapping to the same host port would be added on top of the production
    # file's publication (nginx port 8080).
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gomod:
  gocache:
