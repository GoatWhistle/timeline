
services:
  postgres:
    command:
      - postgres
      - -c
      - "log_line_prefix=\e[2m%m\e[0m \e[2m[%p]\e[0m "
      - -c
      - log_timezone=UTC

  migrations:
    command: ["go", "run", "./cmd/timeline", "migrate", "up"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  bootstrap:
    command: ["go", "run", "./cmd/timeline", "admin", "create"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  backend:
    build:
      target: dev
    command: ["go", "run", "./cmd/timeline", "serve"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    healthcheck:
      start_period: 120s
      interval: 5s
      retries: 30

  worker:
    command: ["go", "run", "./cmd/timeline", "worker"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_COLOR: ${LOG_COLOR:-always}
    volumes:
      - ../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  frontend:
    build:
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY: http://backend:8080
      LC_ALL: en_GB.UTF-8
      TZ: UTC
      FORCE_COLOR: "1"
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gomod:
  gocache:
