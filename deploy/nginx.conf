# Serving the SPA and proxying the API on one origin.
#
# A single origin is mandatory: access_token and refresh_token are set as
# HttpOnly cookies with SameSite=Lax, and the CSRF token is checked against the
# csrf_token cookie (docs/api-conventions.md). If the frontend went to another
# host, CORS with credentials and SameSite=None would be required.

upstream api_backend {
    server api:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Probe for nginx itself: /healthz belongs to the backend and is proxied.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The calendar feed carries its token in the path, and specification
    # section 18 forbids tokens in logs. The token cannot be moved to a header:
    # calendar clients fetch the URL as given. So this one route is proxied
    # exactly like /api/ but never written to the access log.
    location ~ ^/api/v[0-9]+/calendar/ {
        access_log off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The application API. The path is passed through as is: /api/v1/... .
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI and the backend service probes.
    location ~ ^/(docs|healthz|readyz)(/|$) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite assets carry a hash in the name, so they are cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is not cached: otherwise the client would stay on an old build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: any unknown path serves the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
