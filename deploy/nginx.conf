# Раздача SPA и проксирование API на один origin.
#
# Единый origin обязателен: access_token и refresh_token выставляются как
# HttpOnly cookie с SameSite=Lax, а CSRF-токен сверяется с cookie csrf_token
# (docs/api-conventions.md). Если бы фронтенд ходил на другой хост,
# потребовались бы CORS с credentials и SameSite=None.

upstream api_backend {
    server api:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Проба самого nginx: /healthz принадлежит backend и проксируется.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Прикладной API. Путь передаётся как есть: /api/v1/... .
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI и служебные пробы backend.
    location ~ ^/(docs|healthz|readyz)(/|$) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ассеты Vite содержат хеш в имени, поэтому кэшируются надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируется: иначе клиент останется на старой сборке.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Клиентская маршрутизация: любой неизвестный путь отдаёт SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
