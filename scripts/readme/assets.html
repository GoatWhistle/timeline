<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<title>README assets</title>
<link rel="stylesheet" href="../../frontend/src/styles/tokens/palette.css">
<link rel="stylesheet" href="../../frontend/src/styles/tokens/semantic.css">
<link rel="stylesheet" href="../../frontend/src/styles/tokens/dark.css">
<style>
@font-face {
  font-family: "Geist Variable";
  font-weight: 100 900;
  src: url(../../frontend/public/fonts/geist-latin-wght-normal.woff2) format("woff2-variations");
}

html,
body {
  margin: 0;
  background: transparent;
}

body {
  display: grid;
  justify-items: start;
  gap: 32px;
  padding: 48px;
  font-family: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}

[data-asset] {
  box-sizing: border-box;
}

#generated {
  display: grid;
  justify-items: start;
  gap: 24px;
}

#icons {
  display: none;
}

.banner {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 26px;
  width: 880px;
  height: 200px;
}

.lockup {
  display: flex;
  align-items: center;
  gap: 18px;
}

.mark {
  display: block;
  width: 76px;
  height: 76px;
  color: var(--logo);
}

.mark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.mark .lead,
.mark .tail {
  opacity: var(--logo-track-opacity);
}

.wordmark {
  font-size: 60px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-box: trim-both cap alphabetic;
}

.wordmark .tail {
  color: var(--logo);
}

.promise {
  max-width: 720px;
  margin: 0;
  text-align: center;
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -0.012em;
  color: var(--muted-foreground);
  text-wrap: balance;
}

.promise em {
  font-style: normal;
  color: var(--foreground);
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 18px 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-control);
  background: var(--card);
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--foreground);
}

.cta.is-primary {
  border-color: transparent;
  background: var(--primary);
  color: var(--primary-foreground);
}

.cta svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.badge {
  display: inline-flex;
  align-items: stretch;
  height: 28px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-control);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
}

.badge > span {
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
}

.badge > .label {
  background: var(--muted);
  color: var(--muted-foreground);
}

.badge > .value {
  background: var(--card);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--foreground);
}

.badge.is-accent {
  border-color: var(--primary);
}

.badge.is-accent > .value {
  background: var(--primary);
  color: var(--primary-foreground);
}

.badge.is-nav {
  height: 26px;
  border-color: var(--border);
  border-radius: var(--radius-pill);
}

.badge.is-nav > .value {
  padding: 0 12px;
  font-weight: 500;
  color: var(--muted-foreground);
}

.badge.is-warning > .value {
  color: var(--accent);
}

.text {
  display: block;
  line-height: 1;
  text-box: trim-both cap alphabetic;
}
</style>
</head>
<body>

<div class="banner" data-asset="banner">
  <div class="lockup">
    <span class="mark" data-mark></span>
    <span class="wordmark">Time<span class="tail">line</span></span>
  </div>
  <p class="promise">Every hackathon you are in, <em>on one timeline</em></p>
</div>

<span class="mark" data-asset="mark" data-mark style="width: 32px; height: 32px"></span>

<div id="generated"></div>

<div id="icons">
  <svg data-icon="external-link" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
  <svg data-icon="terminal" aria-hidden="true" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></svg>
  <svg data-icon="book-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
  <svg data-icon="file-text" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></svg>
</div>

</body>
</html>
