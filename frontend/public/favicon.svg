<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Timeline">
  <title>Timeline</title>
  <style>
    .mark { fill: #ba5e00; stroke: #ba5e00; }
    .track { opacity: 0.9; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #f4a34b; stroke: #f4a34b; }
      .track { opacity: 0.55; }
    }
  </style>
  <g class="mark">
    <path class="track" d="M4 12h16" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <circle class="track" cx="4" cy="12" r="2.5" stroke="none"/>
    <circle class="track" cx="20" cy="12" r="2.5" stroke="none"/>
    <circle cx="12" cy="12" r="5.5" stroke="none"/>
  </g>
</svg>
