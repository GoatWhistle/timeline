        failure.

        A place may accompany only SHORTLISTED, WINNER or PRIZE — "first place" alongside
        "took part" would contradict itself.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Outcome
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SaveOutcomeRequest'
