host: localhost:8080
info:
  contact:
    name: Timeline team
  description: |-
    Timeline REST API. Implements technical specification v0.8:
    accounts and invites, events and stages, participant assignments,
    registration with self-reported status, reminder rules and the audit log.

    The system does not verify the external registration site: the status is self-reported
    by the user or set administratively.

    Authentication is cookie-based: the access token lives 15 minutes, the refresh token
    rotates and lives 30 days. Every mutating request must send
    a CSRF token in the X-CSRF-Token header; obtain one from GET /auth/csrf.
    All timestamps are transferred in UTC using RFC 3339.
  license:
    name: MIT
  termsOfService: https://github.com/GoatWhistle/timeline
  title: Timeline API
  version: 0.8.0
paths:
  /admin/audit:
    get:
      description: Restricted to administrators. Entries are immutable; file export
        is not supported in the MVP.
      parameters:
      - description: Filter by actor
        format: uuid
        in: query
        name: actor_user_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by entity type
        in: query
        name: entity_type
        type: string
      - description: Filter by entity identifier
        format: uuid
        in: query
        name: entity_id
        type: string
      - description: Start of the period, RFC3339
        in: query
        name: from
        type: string
      - description: End of the period, RFC3339
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Audit log
      tags:
      - audit
  /admin/events:
    get:
      description: Administrative list with every state, search and filters.
      parameters:
      - description: Search by title and organiser
        in: query
        name: search
        type: string
      - description: Comma-separated state filter
        enum:
        - UNPUBLISHED
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - description: Comma-separated kind filter
        enum:
        - HACKATHON
        - MEETUP
        in: query
        name: kind
        type: string
      - description: Comma-separated origin filter
        enum:
        - RU
        - WORLD
        in: query
        name: origin
        type: string
      - description: Comma-separated format filter
        enum:
        - ONLINE
        - OFFLINE
        - HYBRID
        in: query
        name: format
        type: string
      - description: Include archived records
        in: query
        name: include_archived
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event list
      tags:
      - events
    post:
      consumes:
      - application/json
      description: The event is created unpublished; end_at must be later than start_at.
      parameters:
      - description: Event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create an event
      tags:
      - events
  /admin/events/{id}:
    delete:
      description: |-
        Removes the event together with its stages, participants and stored covers.
        An event that already produced notifications cannot be removed: archive it instead.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: the event is referenced by notifications
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete an event
      tags:
      - events
    get:
      description: Administrative read of the whole event.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
