        name: key
        required: true
        type: string
      produces:
      - image/png
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Fetch a stored avatar
      tags:
      - profile
  /catalog:
    get:
      description: |-
        Every published, non-archived event regardless of participation. The response
        carries a dedicated payload built for the catalog.

        The catalog requires a session: an anonymous request is answered with 401. An
        unauthenticated listing would enumerate every event of the organisation together
        with its organisers and prize pools, and the system is internal. It also carries
        its own rate limit, counted per account, because a catalog page is heavier than
        other reads: substring search, filters and the stages of the page.
      parameters:
      - description: Search by title and organiser
        in: query
        name: search
        type: string
      - description: 'Comma-separated origin filter. Omit it for the All view: RU
          and WORLD cover every event.'
        enum:
        - RU
        - WORLD
        in: query
        name: origin
        type: string
      - description: Comma-separated format filter. OFFLINE and HYBRID also match
          an event whose own format is ONLINE when at least one of its stages is held
          in person.
        enum:
        - ONLINE
        - OFFLINE
        - HYBRID
        in: query
        name: format
        type: string
      - description: Comma-separated kind filter
        enum:
        - HACKATHON
        - MEETUP
        in: query
        name: kind
        type: string
      - description: Comma-separated state filter
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        in: query
        name: state
        type: string
      - description: Lower bound of the period
        format: date-time
        in: query
        name: from
        type: string
      - description: Upper bound of the period
        format: date-time
        in: query
        name: to
        type: string
      - description: 'Participation filter: true keeps only the events the caller
          takes part in, false only the rest. Omit it for every event.'
        in: query
        name: joined
        type: boolean
      - default: start_at
        description: Sort field
        enum:
        - start_at
        - end_at
        - title
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CatalogPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: too many catalog requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event catalog
      tags:
      - catalog
  /catalog/export:
    get:
      description: |-
        The same events the catalog listing returns, under the same filters and the same
        sort, streamed as CSV instead of paginated JSON. Only the fields the listing
        itself exposes are written.

        Like the listing it requires a session and is counted against the catalog rate
        limit of the account. Rows are streamed as they are read, so the response is not
        built in memory.

        The `joined` column repeats the participation the listing shows. It says whether
        the account takes part in the event, not whether anyone registered on an external
        site: the system never checks that.
      parameters:
      - description: Search by title and organiser
        in: query
        name: search
        type: string
      - description: Comma-separated origin filter
        enum:
        - RU
        - WORLD
        in: query
        name: origin
        type: string
      - description: Comma-separated format filter
        enum:
        - ONLINE
        - OFFLINE
        - HYBRID
        in: query
        name: format
        type: string
      - description: Comma-separated kind filter
        enum:
        - HACKATHON
        - MEETUP
        in: query
        name: kind
        type: string
      - description: Comma-separated state filter
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        in: query
        name: state
        type: string
      - description: Lower bound of the period
        format: date-time
        in: query
        name: from
        type: string
      - description: Upper bound of the period
        format: date-time
        in: query
        name: to
        type: string
      - default: start_at
        description: Sort field
        enum:
        - start_at
        - end_at
        - title
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV payload
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: too many catalog requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Export the catalog as CSV
      tags:
      - catalog
