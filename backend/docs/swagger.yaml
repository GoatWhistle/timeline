        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.StageType'
        enum:
        - REGISTRATION
        - SELECTION
        - PARTICIPATION
        - CHECKPOINT
        - SUBMISSION
        - DEMO
        - RESULTS
        - OTHER
      url:
        type: string
    type: object
  models.UpdateTeamRoleRequest:
    properties:
      team_role:
        example: Капитан
        type: string
    type: object
  models.UserPage:
    properties:
      items:
        items:
          $ref: '#/definitions/models.UserSummary'
        type: array
      meta:
        $ref: '#/definitions/models.PageMeta'
    type: object
  models.UserSummary:
    properties:
      display_name:
        example: Иван Петров
        type: string
      email:
        example: ivan@example.com
        type: string
      id:
        type: string
      is_active:
        example: true
        type: boolean
    type: object
  models.WorkerHeartbeatResponse:
    properties:
      failed_count:
        example: 0
        type: integer
      healthy:
        example: true
        type: boolean
      oldest_pending_age_seconds:
        example: 12.5
        type: number
      pending_count:
        example: 3
        type: integer
      processing_count:
        example: 1
        type: integer
      scheduler_last_run_at:
        type: string
      undeliverable_count:
        example: 0
        type: integer
      worker_last_run_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Команда Hackathon Tracker
  description: |-
    REST API системы Hackathon Tracker. Реализует техническое задание v0.8:
    учётные записи и приглашения, события и этапы, назначения участников,
    регистрацию с самоотчётом статуса, правила напоминаний и журнал аудита.

    Система не проверяет внешний сайт регистрации: статус является самоотчётом
    пользователя либо административно установленным состоянием.

    Аутентификация — cookie-схема: access token живёт 15 минут, refresh token
    ротируется и живёт 30 дней. Все изменяющие запросы обязаны передавать
    CSRF-токен заголовком X-CSRF-Token; получить его можно на GET /auth/csrf.
    Все моменты времени передаются в UTC в формате RFC 3339.
  license:
    name: MIT
  termsOfService: https://github.com/kaifarikman/hackathon-os
  title: Hackathon Tracker API
  version: 0.8.0
paths:
  /admin/audit:
    get:
      description: Доступен только администратору. Записи неизменяемы; выгрузка файлом
        в MVP не поддерживается.
      parameters:
      - description: Фильтр по актору
        format: uuid
        in: query
        name: actor_user_id
        type: string
      - description: Фильтр по действию
        in: query
        name: action
        type: string
      - description: Фильтр по типу объекта
        in: query
        name: entity_type
        type: string
      - description: Фильтр по идентификатору объекта
        format: uuid
        in: query
        name: entity_id
        type: string
      - description: Начало периода, RFC3339
        in: query
        name: from
        type: string
      - description: Конец периода, RFC3339
        in: query
        name: to
        type: string
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 50
        description: Размер страницы
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Журнал аудита
      tags:
      - audit
  /admin/events:
    get:
      description: Административный список со всеми состояниями, поиском и фильтрами.
      parameters:
      - description: Поиск по названию и организатору
        in: query
        name: search
        type: string
      - description: Фильтр состояний через запятую
        enum:
        - UNPUBLISHED
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - description: Показывать архивные
        in: query
        name: include_archived
        type: boolean
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 50
        description: Размер страницы
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Список событий
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Событие создаётся неопубликованным; end_at обязан быть позже start_at.
      parameters:
      - description: Данные события
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создание события
      tags:
      - events
  /admin/events/{id}:
    get:
      description: Административное чтение, включая заметки.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Событие целиком
      tags:
      - events
    patch:
      consumes:
      - application/json
      description: |-
        Изменение end_at увеличивает schedule_version регистрации, отменяет устаревшие
        ожидающие уведомления и запускает согласование. Нарушение условия
        deadline_at <= end_at отклоняется.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: дедлайн регистрации выходит за end_at
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменение события
      tags:
      - events
  /admin/events/{id}/archive:
    post:
      description: 'Конечное состояние MVP: ожидающие уведомления отменяются, новые
        не создаются.'
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: событие уже архивировано
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Архивирование события
      tags:
      - events
  /admin/events/{id}/participants:
    get:
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Фильтр по функции участника
        in: query
        name: team_role
        type: string
      - description: Фильтр по статусу регистрации
        enum:
        - TODO
        - DONE
        - NOT_REQUIRED
        in: query
        name: registration_status
        type: string
      - description: Включая удалённых из состава
        in: query
        name: include_removed
        type: boolean
      - description: Поиск по имени и email
        in: query
        name: search
        type: string
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 50
        description: Размер страницы
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Состав участников события
      tags:
      - participants
  /admin/events/{id}/participants/batch-add:
    post:
      consumes:
      - application/json
      description: |-
        Повторное добавление ранее удалённого участника реактивирует запись и увеличивает
        assignment_version. Назначение, статус регистрации, первичное уведомление и запись
        аудита выполняются одной транзакцией на участника; результат возвращается по каждому элементу.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Список пользователей и их функций
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AddParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Массовое добавление участников
      tags:
      - participants
  /admin/events/{id}/participants/batch-remove:
    post:
      consumes:
      - application/json
      description: Переводит участие в REMOVED и отменяет ожидающие уведомления. Отправленные
        сохраняются.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Идентификаторы участников
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RemoveParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Массовое удаление участников
      tags:
      - participants
  /admin/events/{id}/participants/copy-from:
    post:
      consumes:
      - application/json
      description: |-
        Переносятся только назначенные участники. Функция участника переносится как значение
        по умолчанию и может быть переопределена. Существующие участники пропускаются
        и возвращаются отдельными элементами результата.
      parameters:
      - description: Идентификатор целевого события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Источник и переопределения функций
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CopyParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Копирование состава из другого события
      tags:
      - participants
  /admin/events/{id}/publish:
    post:
      description: |-
        Событие становится видимым участникам и планировщику; отложенные первичные
        уведомления создаются согласованием.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: событие уже опубликовано или архивировано
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Публикация события
      tags:
      - events
  /admin/events/{id}/registration:
    get:
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Регистрация события
      tags:
      - registration
    patch:
      consumes:
      - application/json
      description: |-
        Изменение ссылки увеличивает notification_content_version, изменение дедлайна —
        schedule_version. В обоих случаях ожидающие уведомления отменяются, а актуальные
        создаются согласованием с новым логическим ключом.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRegistrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменение регистрации
      tags:
      - registration
    post:
      consumes:
      - application/json
      description: |-
        Создание активной регистрации создаёт недостающие статусы TODO всем назначенным
        участникам. Первичные уведомления создаются только для опубликованного неархивного
        события; иначе они откладываются до публикации. Дедлайн обязан удовлетворять
        условию deadline_at <= event.end_at.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Ссылка и дедлайн
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: регистрация уже существует или дедлайн выходит за end_at
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создание регистрации
      tags:
      - registration
  /admin/events/{id}/registration-statuses:
    get:
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 50
        description: Размер страницы
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationStatusPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Статусы регистрации участников
      tags:
      - registration
  /admin/events/{id}/registration-statuses/batch-set:
    post:
      consumes:
      - application/json
      description: Допускаются значения TODO и NOT_REQUIRED. Результат возвращается
        по каждому участнику.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Участники и целевой статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BatchSetStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Массовая установка статуса
      tags:
      - registration
  /admin/events/{id}/registration-statuses/batch-set/preview:
    post:
      consumes:
      - application/json
      description: Возвращает количество изменяемых и пропускаемых записей без изменения
        данных.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Участники и целевой статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BatchSetStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PreviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Предпросмотр массовой установки статуса
      tags:
      - registration
  /admin/events/{id}/registration/disable:
    post:
      description: Ожидающие уведомления отменяются, статусы сохраняются, но перестают
        быть actionable.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: регистрация уже выключена
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Выключение регистрации
      tags:
      - registration
  /admin/events/{id}/registration/enable:
    post:
      description: |-
        Увеличивает activation_version и schedule_version, создаёт недостающие статусы;
