  /teams/{id}/events:
    get:
      description: Every entry the team holds, each with its own roster and derived
        standing.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Events a team entered
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: |-
        Restricted to the team lead. Only a published, non-archived event of kind HACKATHON
        accepts a team entry. The entry starts with an empty roster: the lead then draws a
        lineup for this event from the team's active members, and the team's size limits
        apply to that lineup, not to the whole team. Entering registers nobody: registration
        stays the self-report of each member and the system never checks the external site.
        An event that has already finished no longer accepts an entry and is refused with
        409 invalid_state_transition.
        A track may be chosen here when the hackathon declares any; the choice is optional
        and can be changed until the event starts.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event to enter
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EnterEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Enter a hackathon as a team
      tags:
      - teams
  /teams/{id}/events/{event_id}:
    get:
      description: |-
        `registered` is derived, never stored: the team counts as registered once the number
        of roster members who reported their own registration reaches the event's
        `team_size_min`. Team members outside this event's roster do not count towards it.
        An event without `team_size_min` has no threshold and is never derived registered.
        Every count is a self-report, not a verified fact.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event identifier
        example: ev_gma9hq8a96q5
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Team standing on an event
      tags:
      - teams
  /teams/{id}/events/{event_id}/links:
    get:
      description: |-
        Links the team keeps beside its entry into one hackathon: the repository, the
        board, the deployed demo. They belong to the team, not to a person, and only
        the team can read them. Somebody outside the team gets 404 for the entry, so
        no list discloses that a rival team even entered.

        The kind of a link is not stored: the client derives the service from the
        address, exactly as it does for profile links, so a new service needs no
        migration. `can_write` says whether the caller may change the list: an active
        member may, somebody still holding an unaccepted invitation may not.
      parameters:
      - description: Team
        in: path
        name: id
        required: true
        type: string
      - description: Event
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventLinkListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: the team or its entry is not visible to the caller
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: The team's own links for one hackathon
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: |-
        Appends a link to the end of the team's list for this entry. Any active member
        may add one, the lead included; an invitation that has not been accepted grants
        no write. The address must parse and use http or https, so a scheme that
        executes in the browser or hands the address to an operating system handler is
        rejected. HTTPS is not required. The number of links per entry is bounded.
      parameters:
      - description: Team
        in: path
        name: id
        required: true
        type: string
      - description: Event
        in: path
        name: event_id
        required: true
        type: string
      - description: Link
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTeamEventLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TeamEventLink'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: the caller is not an active member
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: the link limit for this entry is reached
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Add a team link to a hackathon
      tags:
      - teams
  /teams/{id}/events/{event_id}/links/order:
    put:
      consumes:
      - application/json
      description: |-
        Replaces the display order. Every link of the entry must be listed exactly
        once, so a stale client cannot silently drop a row somebody else added.
      parameters:
      - description: Team
        in: path
        name: id
        required: true
        type: string
      - description: Event
        in: path
        name: event_id
        required: true
        type: string
      - description: Wanted order
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReorderTeamEventLinksRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventLinkListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Reorder the team links of a hackathon
      tags:
      - teams
  /teams/{id}/events/{event_id}/roster/{user_id}:
    delete:
      description: |-
        Restricted to the team lead. The member stays in the team; only this event's lineup
        loses them. Their personal registration status on the event is left untouched.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event identifier
        example: ev_gma9hq8a96q5
        in: path
        name: event_id
        required: true
        type: string
      - description: User identifier
        example: us_42ej2s5gh7e8
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Take a team member off the event roster
      tags:
      - teams
    put:
      description: |-
        Restricted to the team lead. The lineup for an event is drawn from the team's active
        members and may be smaller than the team. The event's `team_size_max` caps the
        lineup and a further addition is refused with `roster_full`; `team_size_min` is only
        the threshold of the derived registered state and never blocks an addition, so an
        under-filled lineup is allowed while it is being assembled.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event identifier
        example: ev_gma9hq8a96q5
        in: path
        name: event_id
        required: true
        type: string
      - description: User identifier
        example: us_42ej2s5gh7e8
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Put a team member on the event roster
      tags:
      - teams
  /teams/{id}/events/{event_id}/roster/{user_id}/registration/done:
    post:
      description: |-
        Restricted to the team lead, and only for a member on this event's own roster. It
        writes the same personal registration status the member writes themselves, so the
        value stays a self-report relayed by the lead rather than a verified fact; the audit
        log records who marked whom.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event identifier
        example: ev_gma9hq8a96q5
        in: path
        name: event_id
        required: true
        type: string
      - description: User identifier
        example: us_42ej2s5gh7e8
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Mark a roster member as registered
      tags:
      - teams
  /teams/{id}/events/{event_id}/track:
    put:
      consumes:
      - application/json
      description: |-
        Restricted to the team lead. The choice is optional: an empty track_id clears it.
        It can be changed until the event starts; afterwards the request is refused with
        409 invalid_state_transition and nothing is written. Deleting a track leaves every
        entry that had chosen it in place, with the choice unset.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Event identifier
        example: ev_gma9hq8a96q5
        in: path
        name: event_id
        required: true
        type: string
      - description: Track to compete in
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChooseTrackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamEventEntryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Choose the team's track
      tags:
      - teams
  /teams/{id}/invitations:
    post:
      consumes:
      - application/json
      description: |-
        Restricted to the team lead. The person is named by exactly one of `user_id`, `nickname`
        and `email`, and must already have an account: a platform invitation to somebody who is
        not registered yet is an administrator operation, so an address nobody uses answers 404
        with the same body an unknown nickname gets. The invitation lands in the INVITED state
        and the invited person accepts it themselves.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: Person to invite, named one way
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.InviteTeamMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Invite a user into the team
      tags:
      - teams
  /teams/{id}/join-link:
    delete:
      description: |-
        Restricted to the team lead. The address stops working at once and the team is left
        without a link until the lead issues a new one.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Revoke the join link
      tags:
      - teams
    get:
      description: |-
        Restricted to the team lead. It reports whether a link is active and when it expires;
        the token itself is issued once, at rotation, and is never returned again or written
        to the log.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamJoinLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: The team's join link
      tags:
      - teams
    post:
      description: |-
        Restricted to the team lead. A team holds at most one usable link: rotating revokes
        the previous one, so a leaked address stops working the moment a new one is issued.
        The token is returned exactly once in this response and only its hash is stored.
        Anyone signed in who opens the link joins the team as an active member immediately.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TeamJoinLinkSecretResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Issue or rotate the join link
      tags:
      - teams
  /teams/{id}/members/{user_id}:
    delete:
      description: Restricted to the team lead. The lead cannot remove themselves.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      - description: User identifier
        example: us_42ej2s5gh7e8
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamDetailResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Remove a member from the team
      tags:
      - teams
  /teams/{id}/membership:
    delete:
      description: The caller leaves the team themselves. The team lead cannot leave
        their own team.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Leave a team
      tags:
      - teams
    post:
      description: |-
        The invited user turns their own INVITED membership into ACTIVE. Accepting twice
        is not an error.
      parameters:
      - description: Team identifier
        example: tm_42ej2s5gh7e8
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TeamDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Accept an invitation
      tags:
      - teams
  /telegram/webhook:
    post:
      consumes:
      - application/json
      description: Consumes a one-time /start token and binds the Telegram chat to
        its Timeline account.
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "403":
          description: Forbidden
      summary: Telegram linking webhook
      tags:
      - telegram
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Access token in an HttpOnly cookie, issued on sign-in and session
      refresh.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
