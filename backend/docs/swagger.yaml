        учётной записи.
      parameters:
      - description: Адрес электронной почты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Запрос восстановления пароля
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: После смены пароля все активные сессии пользователя отзываются.
      parameters:
      - description: Токен и новый пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Установка нового пароля
      tags:
      - auth
  /auth/refresh:
    post:
      description: Ротация refresh token. Повторное использование отозванного токена
        отзывает всю цепочку сессии.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обновление сессии
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Создаёт учётную запись, отправляет письмо подтверждения на 24 часа и открывает сессию.
        До подтверждения адреса вход разрешён, продуктовые уведомления по email — нет.
        Если передан invite_token, приглашение принимается в той же транзакции.
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: email уже занят
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Потребляет одноразовый токен подтверждения со сроком 24 часа.
      parameters:
      - description: Токен подтверждения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: токен недействителен или истёк
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Подтверждение email
      tags:
      - auth
  /auth/verify-email/resend:
    post:
      consumes:
      - application/json
      description: 'Ограничение частоты: 5 запросов в час на пару IP и email. Ответ
        не раскрывает существование учётной записи.'
      parameters:
      - description: Адрес электронной почты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Повторная отправка письма подтверждения
      tags:
      - auth
  /events/{id}:
    get:
      description: |-
        Функция участника, вычисляемое состояние, этапы, ближайший этап, статус регистрации,
        дедлайн и ссылка. Административные заметки участнику не отдаются.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventCard'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Карточка назначенного события
      tags:
      - queries
  /events/{id}/registration/done:
    post:
      description: |-
        Самоотчёт участника: перевод собственного статуса TODO в DONE. Доступен при активной
        регистрации, назначенном участии и неархивном событии. Система не проверяет внешний сайт.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: недопустимый переход состояния
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отметка о выполненной регистрации
      tags:
      - registration
  /events/{id}/stages:
    get:
      description: Доступно назначенному участнику для опубликованного события и администратору
        всегда.
      parameters:
      - description: Идентификатор события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.StageResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Этапы события
      tags:
      - stages
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Проверка живости
      tags:
      - ops
  /invites/{token}:
    get:
      description: Возвращает адрес и срок действия приглашения без раскрытия иных
        данных.
      parameters:
      - description: Токен приглашения
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.InvitePreview'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Публичный просмотр приглашения
      tags:
      - invites
  /invites/accept:
    post:
      consumes:
      - application/json
      description: |-
        Создаёт учётную запись на адрес приглашения и открывает сессию.
        Остальные неистёкшие приглашения этого адреса отзываются в той же транзакции.
      parameters:
      - description: Токен и данные учётной записи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AcceptInviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Принятие приглашения
      tags:
      - invites
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Собственный профиль
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Флаг администратора, chat_id Telegram и пароль этим endpoint не
        изменяются.
      parameters:
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменение собственного профиля
      tags:
      - profile
  /me/deactivate:
    post:
      description: |-
        Отзывает сессии, удаляет привязку Telegram и отменяет ожидающие уведомления.
        Обратная активация выполняется администратором.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Деактивация собственной учётной записи
      tags:
      - profile
  /me/email-change:
    post:
      consumes:
      - application/json
      description: Новый адрес сохраняется как pending_email и становится основным
        только после подтверждения.
      parameters:
      - description: Новый адрес и текущий пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: адрес уже занят
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Запрос смены email
      tags:
      - profile
  /me/events:
    get:
      description: |-
        Опубликованные события с назначенным участием: UPCOMING, ACTIVE и FINISHED.
        Архивные скрыты по умолчанию и доступны фильтром.
      parameters:
      - description: Показывать архивные
        in: query
        name: include_archived
        type: boolean
      - description: Фильтр состояний через запятую
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 50
        description: Размер страницы
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MyEventPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Мои события
      tags:
      - queries
  /me/telegram:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отвязка Telegram
      tags:
      - profile
  /me/telegram/link:
    post:
      description: |-
        Возвращает одноразовый deep-link, связанный с текущим пользователем.
        Идентификатор чата устанавливается только этим потоком.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TelegramLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Ссылка привязки Telegram
      tags:
      - profile
  /me/timeline:
    get:
      description: |-
        Только назначенные опубликованные неархивные события. Каждое событие — отдельная строка,
        этапы отдаются интервалами, дедлайн регистрации — отдельным маркером.
      parameters:
      - description: Начало периода, RFC3339
        in: query
        name: from
        type: string
      - description: Конец периода, RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TimelineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Временная шкала пользователя
      tags:
      - queries
  /metrics:
    get:
      description: |-
        Защищённый endpoint. Требует заголовок Authorization с bearer-токеном METRICS_TOKEN,
        если токен задан конфигурацией.
      produces:
      - text/plain
      responses:
        "200":
          description: метрики в формате Prometheus
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Метрики Prometheus
      tags:
      - ops
  /ops/worker-heartbeat:
    get:
      description: |-
        Время последних запусков планировщика и worker, длины очереди по статусам
        и возраст самой старой ожидающей записи.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Состояние фоновых процессов
      tags:
      - ops
  /readyz:
    get:
      description: Проверяет доступность базы данных.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ReadyResponse'
      summary: Проверка готовности
      tags:
      - ops
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Access token в HttpOnly cookie, выдаётся при входе и обновлении сессии.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
