        only after confirmation.
      parameters:
      - description: New address and current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: address is already taken
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Request an email change
      tags:
      - profile
  /me/events:
    get:
      description: |-
        Published events with an assigned participation: UPCOMING, ACTIVE and FINISHED.
        Archived records are hidden by default and available through a filter.
      parameters:
      - description: Include archived records
        in: query
        name: include_archived
        type: boolean
      - description: Comma-separated state filter
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MyEventPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: My events
      tags:
      - queries
  /me/events-feed:
    get:
      description: |-
        The system event bus, not the notification queue of specification section 9. A row here
        mirrors something that happened; it never competes with Telegram or email for delivery
        and never enters the deduplication and retry machinery of a Notification.

        The feed returns exactly two audiences: events addressed to the caller personally and,
        for an administrator, events addressed to administrators. There is no way to read
        somebody else's feed.
      parameters:
      - description: Return only entries the caller has not read
        in: query
        name: unread
        type: boolean
      - description: Page number, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SystemEventPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own event feed
      tags:
      - events-feed
  /me/events-feed/read:
    post:
      consumes:
      - application/json
      description: |-
        Marks the listed events read for the caller. An empty list marks the whole visible feed.
        Identifiers outside the caller's audience are ignored rather than reported: the endpoint
        must not become a way to probe which events exist.
      parameters:
      - description: Identifiers to mark, empty for all
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MarkReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UnreadCountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Mark events as read
      tags:
      - events-feed
  /me/events-feed/unread-count:
    get:
      description: |-
        The number the bell shows. Requested over REST on connect; the socket only sends the
        delta afterwards, so the counter is correct even when the socket never opens.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UnreadCountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Unread event count
      tags:
      - events-feed
  /me/events/{id}/artifacts:
    get:
      description: |-
        What the caller says they submitted for the event: repository, video, slides,
        demo stand or submission page.

        The submitted mark is the participant's own word, exactly like the registration
        status of specification 1: the system never checks an external site, so nothing
        here is a verified fact.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArtifactListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own submission artifacts
      tags:
      - personal
    post:
      consumes:
      - application/json
      description: |-
        Records one artifact of the caller for the event. The link is only checked for
        being a parseable address whose scheme is on the accepted list, so a scheme
        that executes in a browser or reaches an operating system handler is rejected.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Artifact
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArtifactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ParticipantArtifact'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: the artifact limit for this event is reached
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Add an own artifact
      tags:
      - personal
  /me/events/{id}/note:
    get:
      description: |-
        The caller's private Markdown note for one event. A missing note is answered
        with an empty body rather than 404, so the editor opens on a blank page.

        The server stores and returns the Markdown source and never renders it to HTML;
        rendering belongs to the client. Nobody else can read this note, an
        administrator included.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantNote'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: the event is not visible to the caller
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own note for an event
      tags:
      - personal
    put:
      consumes:
      - application/json
      description: |-
        Stores the caller's note for the event; the endpoint suits autosave. Saving an
        empty body deletes the record instead of keeping a blank one, so a list of
        events carrying notes never fills with empty entries.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Markdown source
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantNote'
        "400":
          description: the note is too long
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Save an own note
      tags:
      - personal
  /me/events/{id}/outcome:
    delete:
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: the outcome is deleted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete an own outcome
      tags:
      - personal
    get:
      description: |-
        The caller's self-reported result: how it went, and optionally a place, a prize,
        a track and a note. The outcome is the participant's own account, not a verified
        standing.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: no outcome recorded yet
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own outcome for an event
      tags:
      - personal
    put:
      consumes:
      - application/json
      description: |-
        Stores the caller's result for the event. The default is PARTICIPATED, and that
        is a complete outcome rather than an empty one: most events end without a prize,
        and a tracker that can only record wins makes the ordinary case look like a
        failure.

        A place may accompany only SHORTLISTED, WINNER or PRIZE — "first place" alongside
        "took part" would contradict itself.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Outcome
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveOutcomeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantOutcome'
        "400":
          description: a place requires a placing outcome
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Record an own outcome
      tags:
      - personal
  /me/events/{id}/retrospective:
    delete:
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: the retrospective is deleted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete an own retrospective
      tags:
      - personal
    get:
      description: |-
        Three free-text fields the participant fills in after the event: what went well,
        what did not, and what to do differently next time. A personal record in every
        sense of specification 5.4 — only the owner reads it, an administrator has no
        privilege here, and a foreign record answers 404 rather than 403.

        An absent retrospective is returned as an empty one rather than a 404: the screen
        that offers to write it must not have to distinguish "nothing yet" from an error.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantRetrospective'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: the event is not visible to the caller
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own retrospective for an event
      tags:
      - personal
    put:
      consumes:
      - application/json
      description: |-
        Stores the caller's retrospective for the event. Every field is optional on its
        own, but a retrospective whose three fields are all blank is equivalent to an
        absent one and deletes the record — the same rule as the note in specification
        5.4.3, so that a list of events with retrospectives does not fill with blanks.

        The retrospective is a personal record: it never becomes a queued notification
        and never reaches the audit log. Its reminder arrives as a system event on the
        bus of specification 9.9, two days after the event ends.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Retrospective
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveRetrospectiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantRetrospective'
        "400":
          description: a field is too long
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Save an own retrospective
      tags:
      - personal
  /me/events/{id}/tasks:
    get:
      description: |-
        The personal checklist of the caller for one event. A task belongs to the
        person who created it: the listing never shows anyone else's tasks, and an
        administrator has no privilege here either (specification 5.4).

        Personal records are outside the notification and audit domains: a task never
        becomes a queued notification and never reaches the audit log.
      parameters:
      - description: Event identifier
        example: ev_3k7d8gb9be
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TaskListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: the event is not visible to the caller
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own tasks for an event
      tags:
      - personal
    post:
      consumes:
      - application/json
      description: |-
        Adds one task to the caller's personal checklist for the event. The optional
        stage must belong to the same event.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Task
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ParticipantTask'
        "400":
          description: the stage belongs to another event
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: the task limit for this event is reached
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create an own task
      tags:
      - personal
  /me/events/{id}/tasks/apply-template:
    post:
      consumes:
      - application/json
      description: |-
        Creates the caller's tasks from a template in one action. Due dates are counted
        from the event start using the offset of each template item, so a negative
        offset means "before the start".

        A template item whose title already exists among the caller's tasks for this
        event is skipped rather than duplicated, and the per-item outcome is reported
        line by line, so applying the same template twice changes nothing.
      parameters:
      - description: Event identifier
        in: path
        name: id
        required: true
        type: string
      - description: Template to apply
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ApplyTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: unknown template or invisible event
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Apply a checklist template
      tags:
      - personal
  /me/history:
    get:
      description: |-
        A read model over what the caller already accumulated: the events they were
