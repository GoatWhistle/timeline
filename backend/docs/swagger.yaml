        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Queue diagnostics
      tags:
      - ops
  /ops/worker-heartbeat:
    get:
      description: |-
        Last run times of the scheduler and worker, queue lengths by status
        and the age of the oldest pending entry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
      summary: Background process status
      tags:
