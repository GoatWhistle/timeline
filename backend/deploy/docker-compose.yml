name: hackathon-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@postgres:5432/hackathon?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve"]
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@postgres:5432/hackathon?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@postgres:5432/hackathon?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
