version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none

  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    - revive

    - gosec

    - sqlclosecheck
    - rowserrcheck
    - bodyclose

    - dupl

    - funlen
    - gocyclo
    - lll

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      excludes:
        - G115

    dupl:
      threshold: 200

    funlen:
      lines: 60
      statements: 45
      ignore-comments: true

    gocyclo:
      min-complexity: 15

    lll:
      line-length: 120
      tab-width: 4

  exclusions:
    generated: lax

    presets:
      - comments
      - std-error-handling

    paths:
      - backend/docs
      - internal/docs
      - docs

    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - gosec
          - lll
          - errcheck

      - path: ^cmd/
        linters:
          - funlen
          - gocyclo

      - path: internal/adapters/postgres/participation/participant\.go
        linters:
          - funlen
          - lll

      - path: internal/adapters/postgres/query/schedule\.go
        linters:
          - funlen

      - path: internal/adapters/postgres/query/query\.go
        linters:
          - funlen
          - gocyclo
          - lll

      - path: internal/adapters/postgres/audit/audit\.go
        linters:
          - funlen
          - gocyclo

      - path: internal/adapters/postgres/identity/token\.go
        linters:
          - gosec
          - lll

      - path: internal/adapters/postgres/event/event\.go
        linters:
          - lll

      - path: internal/adapters/postgres/participation/status\.go
        linters:
          - lll

      - path: internal/adapters/postgres/participation/registration\.go
        linters:
          - lll

      - path: internal/adapters/postgres/notification/delivery\.go
        linters:
          - lll

      - path: internal/adapters/postgres/notification/scheduler\.go
        linters:
          - lll

      - path: internal/config/config\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/auth/auth\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/event/event\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/event/link\.go
        linters:
          - lll

      - path: internal/controllers/event/link_personal\.go
        linters:
          - lll

      - path: internal/controllers/event/catalog\.go
        linters:
          - lll

      - path: internal/controllers/event/query\.go
        linters:
          - lll

      - path: internal/controllers/notification/rule\.go
        linters:
          - lll

      - path: internal/controllers/participation/participant\.go
        linters:
          - lll

      - path: internal/controllers/participation/participant_batch\.go
        linters:
          - lll

      - path: internal/controllers/personal/record\.go
        linters:
          - lll

      - path: internal/controllers/personal/task\.go
        linters:
          - lll

      - path: internal/controllers/auth/profile_links\.go
        linters:
          - lll

      - path: internal/controllers/participation/status\.go
        linters:
          - lll

      - path: internal/models/dto/event\.go
        linters:
          - lll

      - path: internal/models/dto/notification\.go
        linters:
          - lll

      - path: internal/models/dto/registration\.go
        linters:
          - lll

      - path: internal/controllers/auth/csrf\.go
        linters:
          - lll

      - path: internal/controllers/participation/registration\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/event/event_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/participation/participant_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/auth/profile_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/participation/registration_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/participation/status_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/adapters/postgres/
        source: '^\s*(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN|LEFT|VALUES|ON CONFLICT|RETURNING|ORDER BY|GROUP BY)'
        linters:
          - lll

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  new: false
