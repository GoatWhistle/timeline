# golangci-lint configuration for the backend (part V.1 of the refactoring plan).
# Version 2 format: linters.enable, linters.settings, linters.exclusions.rules.
#
# Run: make back-lint (from the root) or golangci-lint run ./... (from backend/).

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none

  enable:
    # Errors and correctness.
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # gosimple is not enabled: it was merged into staticcheck and deprecated,
    # golangci-lint fails on an attempt to enable it.

    # Style and naming.
    - revive

    # Security: critical for auth, CSRF and token handling.
    - gosec

    # Cursor leaks and unclosed response bodies.
    - sqlclosecheck
    - rowserrcheck
    - bodyclose

    # Duplication.
    - dupl

    # Size and complexity. Introduced as a ratchet: at the time of enabling,
    # 25 files exceed the limit and functions are noticeably longer than 60
    # lines. A hard threshold would break CI on the very first day and the check
    # would be switched off entirely - exactly the way of burying a requirement
    # that section VI.2 warns about. So the target values are recorded in
    # settings below, while existing code is taken out from under them by rules
    # in exclusions.rules. As files are split up (task 42), paths are removed
    # from the exclusions and the rule starts applying to them in full force.
    - funlen
    - gocyclo
    - lll

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        # fieldalignment reorders struct fields to save bytes - the field
        # order matters more here.
        - fieldalignment
        # shadow produces 53 hits on the idiomatic `if err := ...` and not a
        # single real bug: shadowing err is normal in Go.
        - shadow

    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      excludes:
        - G115

    dupl:
      threshold: 200

    # Target values from section V.1. They apply to new code; existing files
    # are listed in exclusions.rules and are brought up to them gradually.
    funlen:
      lines: 60
      statements: 45
      ignore-comments: true

    gocyclo:
      min-complexity: 15

    lll:
      line-length: 120
      tab-width: 4

  exclusions:
    generated: lax

    presets:
      - comments
      - std-error-handling

    paths:
      # Generated by swag, not edited by hand.
      - backend/docs
      - internal/docs
      - docs

    rules:
      # In tests, length and duplication are normal: a table of scenarios reads
      # better as one solid piece than spread across helper functions.
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - gosec
          - lll
          - errcheck

      # Entry point: wiring dependencies is a long linear function by nature.
      - path: ^cmd/
        linters:
          - funlen
          - gocyclo

      # Size and complexity ratchet. The list equals the current level
      # (docs/baselines/file-length.txt) and is only updated downwards: a line
      # is removed from here once the file is split and passes the check itself.
      - path: internal/adapters/repositories/event_repo\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/adapters/repositories/notification_repo\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/adapters/repositories/query_repo\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/adapters/repositories/registration_repo\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/config/config\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/auth_controller\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/event_controller\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/controllers/registration_controller\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/auth_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/delivery_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/event_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/participant_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/profile_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/registration_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      - path: internal/services/status_service\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - lll

      # SQL queries in the repositories longer than 120 characters are not
      # wrapped: a line break inside a query makes it unreadable.
      - path: internal/adapters/repositories/
        source: '^\s*(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN|LEFT|VALUES|ON CONFLICT|RETURNING|ORDER BY|GROUP BY)'
        linters:
          - lll

issues:
  # Show every issue found, not the first three per linter.
  max-issues-per-linter: 0
  max-same-issues: 0

  # Ratchet. At the time the linter was enabled, the existing code produces 88
  # issues: 75 lll, 4 funlen, 3 gocyclo, 2 unused, 2 gosec, 1 errcheck,
  # 1 revive. Turning them on all at once means breaking CI on the very first
  # day, after which the linter gets switched off entirely (section VI.2 of the
  # plan). So in CI the linter runs with --new-from-merge-base: an issue blocks
  # the build only if it was introduced by the change itself. The existing debt
  # is visible in a plain `make back-lint` and is worked through by stage 6
  # tasks.
  new: false
