  /me/sessions:
    get:
      description: |-
        Every active session of the calling account: the device that opened it, the address
        it was opened from, when it was opened, when it was last used and when it expires.
        One entry carries current=true — the session this very request authenticated with,
        determined by the session identifier inside the access token.

        Only the caller's own sessions are returned, and only to their owner. The user agent
        and the address are personal data of the account holder: no other account reaches them
        through this endpoint, an administrator included. Revoked and expired sessions are not
        listed — the endpoint shows what is live now, it is not a sign-in history.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SessionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Own active sessions
      tags:
      - auth
  /me/sessions/{id}:
    delete:
      description: |-
        Revokes the refresh token of a single session, leaving the other devices signed in.
        Repeating the call on an already revoked or expired session succeeds as well.

        The session must belong to the caller. An identifier of somebody else's session is
        answered with 404 rather than 403: the very existence of another account's session
        must not be disclosed. Terminating the current session is allowed and clears the
        cookies of this response, which makes it equivalent to signing out.

        The outstanding access token stays valid for the rest of its 15 minutes: revocation
        ends the refresh chain, it does not reach a token already issued.
      parameters:
      - description: Session identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: the session does not exist or belongs to another account
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Terminate one own session
      tags:
      - auth
  /me/tasks/{id}:
    delete:
      description: |-
        Removes one task of the caller. Personal records may be deleted outright:
        unlike the administrative layer, they carry no retention obligation.
      parameters:
      - description: Task identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: the task is deleted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete an own task
      tags:
      - personal
    patch:
      consumes:
      - application/json
      description: |-
        Changes one task of the caller. Marking a task done and undone are both plain
        updates: the transition is reversible and produces neither a notification nor
        an audit entry. A task of another user answers 404, never 403.
      parameters:
      - description: Task identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantTask'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: the task belongs to another user
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update an own task
      tags:
      - personal
  /me/telegram:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Unlink Telegram
      tags:
      - profile
  /me/telegram/link:
    post:
      description: |-
        Returns a one-time deep link bound to the current user.
        The chat identifier is set only by this flow.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TelegramLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Telegram link URL
      tags:
      - profile
  /metrics:
    get:
      description: |-
        Protected endpoint. Requires an Authorization header with the METRICS_TOKEN bearer token,
        when the token is set by configuration.
      produces:
      - text/plain
      responses:
        "200":
          description: metrics in Prometheus format
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Prometheus metrics
      tags:
      - ops
  /ops/queue:
    get:
      description: |-
        The rows an operator needs to tell a stuck queue apart from a busy one. The heartbeat
        answers whether something is broken; this answers what exactly.

        scope=failures lists terminal failures — FAILED after the four provider calls of
        specification section 9.4.8 are spent, and UNDELIVERABLE when no channel was available
        or every channel closed with a permanent error — each with the reason recorded in
        last_error, the attempt count and the channels already tried.

        scope=stuck-leases lists entries left in PROCESSING whose worker lease expired. That is
        the same set the recovery task of section 9.4.9 returns to the queue; this endpoint only
        reports it and recovers nothing. lease_overdue_seconds says how long the lease has been
        overdue, which separates a worker that died from one that is merely slow.

        The rows carry no payload_json, no recipient and no registration status: an operations
        screen is not a way to read other people's notifications or assignments.
      parameters:
      - description: Rows to return
        enum:
        - failures
        - stuck-leases
        in: query
        name: scope
        type: string
      - description: Page number, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.QueueEntryPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Queue diagnostics
      tags:
      - ops
  /ops/worker-heartbeat:
    get:
      description: |-
        Last run times of the scheduler and worker, queue lengths by status
        and the age of the oldest pending entry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
      summary: Background process status
      tags:
      - ops
  /readyz:
    get:
      description: Checks that the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ReadyResponse'
      summary: Readiness probe
      tags:
      - ops
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Access token in an HttpOnly cookie, issued on sign-in and session
      refresh.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
