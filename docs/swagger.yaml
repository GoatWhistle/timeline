      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: After a password change every active session of the user is revoked.
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Set a new password
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the refresh token. Reusing a revoked token revokes the
        entire session chain.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Refresh the session
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates an account, sends a confirmation email valid for 24 hours and opens a session.
        Sign-in is allowed before the address is confirmed; product email notifications are not.
        If invite_token is supplied, the invite is accepted in the same transaction.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: email is already taken
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Consumes a one-time confirmation token valid for 24 hours.
      parameters:
      - description: Confirmation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: the token is invalid or has expired
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Confirm an email address
      tags:
      - auth
  /auth/verify-email/resend:
    post:
      consumes:
      - application/json
      description: 'Rate limit: 5 requests per hour per IP and email pair. The response
        does not disclose whether an account exists.'
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Resend the confirmation email
      tags:
      - auth
  /catalog:
    get:
      description: |-
        Every published, non-archived event regardless of participation. The response
        carries a dedicated payload that cannot include administrative notes.
      parameters:
      - description: Search by title and organiser
        in: query
        name: search
        type: string
      - description: Comma-separated origin filter
        enum:
        - RU
        - WORLD
        in: query
        name: origin
        type: string
      - description: Comma-separated format filter
        enum:
        - ONLINE
        - OFFLINE
        - HYBRID
        in: query
        name: format
        type: string
      - description: Comma-separated kind filter
        enum:
        - HACKATHON
        - MEETUP
        in: query
        name: kind
        type: string
      - description: Comma-separated state filter
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        in: query
        name: state
        type: string
      - description: Lower bound of the period
        format: date-time
        in: query
        name: from
        type: string
      - description: Upper bound of the period
        format: date-time
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CatalogPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: too many catalog requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event catalog
      tags:
      - catalog
  /events/{id}:
    get:
      description: |-
        Participant role, computed state, stages, the nearest stage, registration status,
        deadline and link. Administrative notes are withheld from the participant.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventCard'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Assigned event card
      tags:
      - queries
  /events/{id}/join:
    post:
      consumes:
      - application/json
      description: |-
        Self-signup: the user joins a published event and supplies their own team role.
        A meetup has no team role, so the field may be omitted.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Own team role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.JoinEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ParticipantSelfResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: the user already takes part in the event
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: too many join attempts
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Join an event
      tags:
      - catalog
  /events/{id}/registration/done:
    post:
      description: |-
        Participant self-report: moves their own TODO status to DONE. Available with an active
        registration, an assigned participation and a non-archived event. The system does not verify the external site.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: invalid state transition
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Mark registration as completed
      tags:
      - registration
  /events/{id}/stages:
    get:
      description: Available to an assigned participant for a published event, and
        to an administrator always.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.StageResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event stages
      tags:
      - stages
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Liveness probe
      tags:
      - ops
  /invites/{token}:
    get:
      description: Returns the address and expiry of the invite without disclosing
        any other data.
      parameters:
      - description: Invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.InvitePreview'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Public invite preview
      tags:
      - invites
  /invites/accept:
    post:
      consumes:
      - application/json
      description: |-
        Creates an account for the invited address and opens a session.
        Any other unexpired invites for this address are revoked in the same transaction.
      parameters:
      - description: Token and account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AcceptInviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Accept an invite
      tags:
      - invites
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Your own profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: The administrator flag, Telegram chat_id and password are not changed
        by this endpoint.
      parameters:
      - description: Mutable fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update your own profile
      tags:
      - profile
  /me/deactivate:
    post:
      description: |-
        Revokes sessions, removes the Telegram link and cancels pending notifications.
        Reactivation is performed by an administrator.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Deactivate your own account
      tags:
      - profile
  /me/email-change:
    post:
      consumes:
      - application/json
      description: The new address is stored as pending_email and becomes primary
        only after confirmation.
      parameters:
      - description: New address and current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: address is already taken
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Request an email change
      tags:
      - profile
  /me/events:
    get:
      description: |-
        Published events with an assigned participation: UPCOMING, ACTIVE and FINISHED.
        Archived records are hidden by default and available through a filter.
      parameters:
      - description: Include archived records
        in: query
        name: include_archived
        type: boolean
      - description: Comma-separated state filter
        enum:
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MyEventPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: My events
      tags:
      - queries
  /me/schedule:
    get:
      description: |-
        Only assigned, published, non-archived events. Each event is a separate row,
        stages are returned as intervals and the registration deadline as a separate marker.
      parameters:
      - description: Start of the period, RFC3339
        in: query
        name: from
        type: string
      - description: End of the period, RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ScheduleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: User schedule
      tags:
      - queries
  /me/telegram:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Unlink Telegram
      tags:
      - profile
  /me/telegram/link:
    post:
      description: |-
        Returns a one-time deep link bound to the current user.
        The chat identifier is set only by this flow.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TelegramLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Telegram link URL
      tags:
      - profile
  /metrics:
    get:
      description: |-
        Protected endpoint. Requires an Authorization header with the METRICS_TOKEN bearer token,
        when the token is set by configuration.
      produces:
      - text/plain
      responses:
        "200":
          description: metrics in Prometheus format
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Prometheus metrics
      tags:
      - ops
  /ops/worker-heartbeat:
    get:
      description: |-
        Last run times of the scheduler and worker, queue lengths by status
        and the age of the oldest pending entry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkerHeartbeatResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Background process status
      tags:
      - ops
  /readyz:
    get:
      description: Checks that the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ReadyResponse'
      summary: Readiness probe
      tags:
      - ops
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Access token in an HttpOnly cookie, issued on sign-in and session
      refresh.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
