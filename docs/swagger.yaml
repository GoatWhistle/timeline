host: localhost:8080
info:
  contact:
    name: Timeline team
  description: |-
    Timeline REST API. Implements technical specification v0.8:
    accounts and invites, events and stages, participant assignments,
    registration with self-reported status, reminder rules and the audit log.

    The system does not verify the external registration site: the status is self-reported
    by the user or set administratively.

    Authentication is cookie-based: the access token lives 15 minutes, the refresh token
    rotates and lives 30 days. Every mutating request must send
    a CSRF token in the X-CSRF-Token header; obtain one from GET /auth/csrf.
    All timestamps are transferred in UTC using RFC 3339.
  license:
    name: MIT
  termsOfService: https://github.com/GoatWhistle/timeline
  title: Timeline API
  version: 0.8.0
paths:
  /admin/audit:
    get:
      description: Restricted to administrators. Entries are immutable; file export
        is not supported in the MVP.
      parameters:
      - description: Filter by actor
        format: uuid
        in: query
        name: actor_user_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by entity type
        in: query
        name: entity_type
        type: string
      - description: Filter by entity identifier
        format: uuid
        in: query
        name: entity_id
        type: string
      - description: Start of the period, RFC3339
        in: query
        name: from
        type: string
      - description: End of the period, RFC3339
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Audit log
      tags:
      - audit
  /admin/events:
    get:
      description: Administrative list with every state, search and filters.
      parameters:
      - description: Search by title and organiser
        in: query
        name: search
        type: string
      - description: Comma-separated state filter
        enum:
        - UNPUBLISHED
        - UPCOMING
        - ACTIVE
        - FINISHED
        - ARCHIVED
        in: query
        name: state
        type: string
      - description: Include archived records
        in: query
        name: include_archived
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event list
      tags:
      - events
    post:
      consumes:
      - application/json
      description: The event is created unpublished; end_at must be later than start_at.
      parameters:
      - description: Event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create an event
      tags:
      - events
  /admin/events/{id}:
    get:
      description: Administrative read, including notes.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: The whole event
      tags:
      - events
    patch:
      consumes:
      - application/json
      description: |-
        Changing end_at increments the registration schedule_version, cancels stale
        pending notifications and triggers reconciliation. Violating the condition
        deadline_at <= end_at is rejected.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Mutable fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: the registration deadline falls outside end_at
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update an event
      tags:
      - events
  /admin/events/{id}/archive:
    post:
      description: 'Terminal state in the MVP: pending notifications are cancelled
        and no new ones are created.'
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: event is already archived
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive an event
      tags:
      - events
  /admin/events/{id}/participants:
    get:
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Filter by participant role
        in: query
        name: team_role
        type: string
      - description: Filter by registration status
        enum:
        - TODO
        - DONE
        - NOT_REQUIRED
        in: query
        name: registration_status
        type: string
      - description: Include participants removed from the roster
        in: query
        name: include_removed
        type: boolean
      - description: Search by name and email
        in: query
        name: search
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ParticipantPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event participant roster
      tags:
      - participants
  /admin/events/{id}/participants/batch-add:
    post:
      consumes:
      - application/json
      description: |-
        Re-adding a previously removed participant reactivates the record and increments
        assignment_version. The assignment, registration status, primary notification and audit
        entry run in a single transaction per participant; the result is returned per entry.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: List of users and their roles
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AddParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Bulk participant assignment
      tags:
      - participants
  /admin/events/{id}/participants/batch-remove:
    post:
      consumes:
      - application/json
      description: Moves participation to REMOVED and cancels pending notifications.
        Sent ones are preserved.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Participant identifiers
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RemoveParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Bulk participant removal
      tags:
      - participants
  /admin/events/{id}/participants/copy-from:
    post:
      consumes:
      - application/json
      description: |-
        Only assigned participants are copied. The participant role is copied as a value
        by default and can be overridden. Existing participants are skipped
        and returned as separate result entries.
      parameters:
      - description: Target event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Source and role overrides
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CopyParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Copy the roster from another event
      tags:
      - participants
  /admin/events/{id}/publish:
    post:
      description: |-
        The event becomes visible to participants and the scheduler; deferred primary
        notifications are created by reconciliation.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: the event is already published or archived
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Publish an event
      tags:
      - events
  /admin/events/{id}/registration:
    get:
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Event registration
      tags:
      - registration
    patch:
      consumes:
      - application/json
      description: |-
        Changing the link increments notification_content_version; changing the deadline increments
        schedule_version. In both cases pending notifications are cancelled and current ones
        are created by reconciliation with a new logical key.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Mutable fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRegistrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update a registration
      tags:
      - registration
    post:
      consumes:
      - application/json
      description: |-
        Creating an active registration creates missing TODO statuses for every assigned
        participant. Primary notifications are created only for a published, non-archived
        event; otherwise they are deferred until publication. The deadline must satisfy
        the condition deadline_at <= event.end_at.
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Link and deadline
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.RegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: registration already exists or the deadline falls outside end_at
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a registration
      tags:
      - registration
  /admin/events/{id}/registration-statuses:
    get:
      parameters:
      - description: Event identifier
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RegistrationStatusPage'
        "403":
